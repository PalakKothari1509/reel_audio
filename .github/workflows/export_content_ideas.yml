name: Export Content Ideas JSON

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/export_content_ideas.yml'
      - 'lib/content_ideas.dart'
      - 'scripts/export_content_ideas.dart'
      - 'scripts/validate_content_ideas.js'
      - 'scripts/verify_export.dart'
      - 'pubspec.yaml'

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.7'
          channel: 'stable'
          cache: true

      - name: Debug environment
        run: |
          flutter --version
          dart --version
          dart pub deps

      - name: Install dependencies
        run: flutter pub get

      - name: Run exporter
        run: dart run scripts/export_content_ideas.dart

      - name: Independent verification (Dart)
        run: dart run scripts/verify_export.dart

      - name: Validate JSON (Node)
        run: node scripts/validate_content_ideas.js

      - name: Verify artifacts
        run: |
          ls -la assets/data/content_ideas.json
          node -e "const fs=require('fs'); const d=JSON.parse(fs.readFileSync('assets/data/content_ideas.json')); console.log('count:', d.ideas.length); console.log('unique:', new Set(d.ideas.map(x=>x.id)).size);"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: content-ideas-json
          path: assets/data/content_ideas.json
          retention-days: 30
