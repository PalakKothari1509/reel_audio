# org.gradle.java.home is deliberately NOT set here. It was pinned to
# "C:\Program Files\Android\Android Studio\jbr", which exists on exactly one machine —
# CI and anyone else who clones this get "Java home supplied is invalid" and no build.
# Left unset, Gradle uses JAVA_HOME, which Flutter and Android Studio both provide.
# If a local build cannot find Java, set it per machine:  flutter config --jdk-dir=...

# HeapDumpOnOutOfMemoryError was removed: it wrote a 672 MB .hprof file into the
# project on the one occasion Gradle ran out of memory, which then blocked a push.
# The out-of-memory message alone says what happened, and 4g is generous.
org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=512m
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true
android.enableJetifier=true
# This builtInKotlin flag was added automatically by Flutter migrator
android.builtInKotlin=false
# This newDsl flag was added automatically by Flutter migrator
android.newDsl=false
